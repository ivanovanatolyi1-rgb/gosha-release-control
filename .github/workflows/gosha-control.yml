name: Gosha release control
run-name: Gosha ${{ inputs.operation || 'checks' }} · ${{ inputs.sha || 'public controller' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character SHA from the private development branch
        required: true
        type: string
      operation:
        description: Verify private CI or request owner approval for this release
        required: true
        type: choice
        default: test
        options: [test, release, automatic]
      ci_run_id:
        description: Exact private CI run ID (automation only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
  private-ci:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.run_attempt == 1 &&
      ((inputs.operation != 'automatic' &&
        github.actor == 'ivanovanatolyi1-rgb' &&
        github.triggering_actor == 'ivanovanatolyi1-rgb') ||
       (inputs.operation == 'automatic' &&
        vars.GOSHA_REQUEST_ACTOR != '' &&
        endsWith(vars.GOSHA_REQUEST_ACTOR, '[bot]') &&
        github.actor == vars.GOSHA_REQUEST_ACTOR &&
        github.triggering_actor == vars.GOSHA_REQUEST_ACTOR))
    needs: checks
    environment: gosha-ci-read
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: checked
        env:
          REQUEST_SHA: ${{ inputs.sha }}
          REQUEST_OPERATION: ${{ inputs.operation }}
          REQUEST_RUN_ID: ${{ inputs.ci_run_id }}
          GOSHA_PRIVATE_CI_TOKEN: ${{ secrets.GOSHA_PRIVATE_CI_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release.py test
          printf 'sha=%s\n' "$REQUEST_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Approve exact SHA ${{ inputs.sha }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.run_attempt == 1 &&
      ((inputs.operation != 'automatic' &&
        github.actor == 'ivanovanatolyi1-rgb' &&
        github.triggering_actor == 'ivanovanatolyi1-rgb') ||
       (inputs.operation == 'automatic' &&
        vars.GOSHA_REQUEST_ACTOR != '' &&
        endsWith(vars.GOSHA_REQUEST_ACTOR, '[bot]') &&
        github.actor == vars.GOSHA_REQUEST_ACTOR &&
        github.triggering_actor == vars.GOSHA_REQUEST_ACTOR)) &&
      (inputs.operation == 'release' || inputs.operation == 'automatic')
    needs: private-ci
    environment: gosha-production
    concurrency:
      group: gosha-manifest-publish
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify the owner's decision for this run
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/release.py approval
      - name: Sign and publish the exact tested SHA
        env:
          REQUEST_SHA: ${{ inputs.sha }}
          TESTED_SHA: ${{ needs.private-ci.outputs.sha }}
          CONTROL_RUN_ID: ${{ github.run_id }}
          CONTROL_SEQUENCE: ${{ github.run_number }}
          SIGNING_KEY: ${{ secrets.GOSHA_RELEASE_SIGNING_KEY }}
          SIGNING_PUBLIC: ${{ vars.GOSHA_APPROVER_SSH_PUBLIC_KEY }}
        run: python3 scripts/release.py publish
